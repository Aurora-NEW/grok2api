server:
  listen: "127.0.0.1:8000"

auth:
  secureCookies: true

secrets:
  jwtSecret: "__JWT_SECRET__"
  credentialEncryptionKey: "__CREDENTIAL_KEY__"

bootstrapAdmin:
  username: "admin"
  password: "__ADMIN_PASSWORD__"

frontend:
  publicApiBaseURL: "https://grok2api.xiaotianyo.com"
  staticPath: "./frontend/dist"

database:
  driver: sqlite
  sqlite:
    path: "./data/backend.db"

runtimeStore:
  driver: memory

deployment:
  replicas: 1
  clusterID: "grok2api"
  sharedMedia: false

media:
  driver: local
  local:
    path: "./data/media"
